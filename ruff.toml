# Single authoritative Ruff configuration for CI and local pre-commit parity.
# A bare ruff.toml (no [lint].select) shadows pyproject.toml's [tool.ruff] table
# and silently falls back to Ruff's built-in default rule set, which expands
# across Ruff releases. Declaring the full contract here pins the rule set so a
# Ruff upgrade cannot surface new lint rules that were never adopted, and the
# duplicate [tool.ruff] table has been removed from pyproject.toml.
target-version = "py310"
line-length = 100
exclude = ["validation", "dist"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
# E501: line length is enforced by the formatter, not the linter.
# S101/S311: asserts and non-crypto randomness are acceptable in this codebase.
# S310/S603/S607/S608: audited subprocess/urllib/SQL call sites.
# E402: assurance tools set sys.dont_write_bytecode before their imports.
ignore = ["E501", "S101", "S311", "S310", "S603", "S607", "S608", "E402"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"src/l9_graphite_memory/secrets.py" = ["S110"]
"src/l9_graphite_memory/schema/__init__.py" = ["F401"]
