schema: l9-graphiti-memory/product-release-binding@1
# Derived repository execution and proof map (ADR-094). This file is NOT
# product authority and defines no release semantics: it binds this
# repository's executable entrypoints to the global release contract, the
# authoritative ProductTopology, and the derived ProductManifest.
# It may narrow or strengthen required evidence; it never weakens global law.
derived_from:
  product_topology: product-topology.yaml
  decision: docs/adr/ADR-094-product-topology-and-release-governance.md
global_release_contract:
  ref: l9.contract/product-release@1
authority:
  repository: Quantum-L9/.github
  revision: d4397e53f8f4c23458a80f87db9552463ad9e26f
  files:
    - path: semantics/authority_model.yaml
      blob: b0337e8912470d76ae64a7cbd0bd95752384f7b2
      digest: sha256:9303ee5910f3db2b10abe71bdcb5e360128ee77e7e4bd3ebe9e05dba77018620
    - path: semantics/contracts.yaml
      blob: 8a0d0513fcb28036682041ca8e759e31d7620f48
      digest: sha256:f1fcc979534d0aa34783710657ae36d765f7078e6ab20dc3b11a31d576539d79
    - path: semantics/dependency_archetypes.yaml
      blob: 88fb55a52086a69d11ae0193a7ac17576baec6c1
      digest: sha256:31d846c51c4f83c87c3ce697e720e73921d108a1946ed81e121f7bfa61e0a8d7
    - path: semantics/product_kinds.yaml
      blob: 7f68d961e5f4744cc1ceadd2390fd0fa417e8c48
