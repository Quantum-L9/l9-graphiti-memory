    - path: semantics/product_topology.schema.yaml
      blob: 3ce98d488304f3d0d6252b753f192e83b042ae1b
      digest: sha256:5ecf2e7a18eef93177230a7f379453dfcd444bedad9f74eba4d1504737bc6520
    - path: semantics/repository_registry.yaml
      blob: 25e281d388d9acb92f563426756e1b0e15571ba6
      digest: sha256:0b8d3df4da548e0f5f511bbc19c233d19bce478515217cbfe507014674295cb2
product:
  kind: dependency
  archetype_ref: l9.dependency-archetype/semantic-subsystem@1
  # Semantic Foundation v3.21.0 (.github PR #183). The topology claims the
  # exception; release admission under it is bound by the floor below.
  kind_exception_ref: l9.product-kind-exception/memory-hosted-service@1
  kind_exception_release_floor: 3.0.0
product_topology:
  path: product-topology.yaml
  digest: sha256:e5eabf4ce5011702765e0c663b786572a09a3f7f06c133c01081733c0a486e5e
  admission_decision_ref: docs/adr/ADR-094-product-topology-and-release-governance.md
  mechanical_validation: tools/assurance/validate_product_topology.py --authority-root <Quantum-L9/.github at authority.revision> --release-version <PACKAGE_VERSION>
product_manifest:
  status: resolved
  ref: release-work/product-manifest.json
  digest: sha256:b6ef52214a60574d3d8b4d49cdaa341752818f99e81ac98cbaf39d03d95ffb29
  generator: tools/assurance/generate_product_manifest.py
  compiler_revision: sha256:3283257400db638a7d12a67b253997575ce198178a9ad5c966c40e081247a18f
  compiler_profile_ref: l9.compilation/product-build@1
  compiler_profile_digest: sha256:bbcb06d010a1b7bc0d3275766e00e9031d6c481cee576235ff389928287487df
  regenerate: python3 tools/assurance/generate_product_manifest.py --authority-root <Quantum-L9/.github at authority.revision>
  check: python3 tools/assurance/generate_product_manifest.py --authority-root <Quantum-L9/.github at authority.revision> --check
  resolved_manifest_gate: pass
  reasons: []
  consequence: the derived ProductManifest gate passes for this topology; release progression still requires an explicit release admission of the frozen candidate.
release_identity:
  version_source: src/l9_graphite_memory/version.py::PACKAGE_VERSION
  identity_tuple:
    - PACKAGE_VERSION
    - exact source revision
    - wheel sha256
    - sdist sha256
  version_carriers_enforced_by: tests/regression/test_release_version_consistency.py
  artifact_forms:
    - wheel
    - sdist
  excluded:
    - clients/typescript (separately versioned @quantum-l9/graphiti-memory-client)
preparation:
  - python3 tools/assurance/apply_l9_meta.py
  - python3 tools/assurance/generate_manifest.py
validation:
  entrypoint: scripts/validate_release.sh
  evidence_dir: build/release-validation
  mode: observational; never mutates the frozen candidate
  publication_mode: L9_RELEASE_ARTIFACT_DIR=<dir holding the exact admitted wheel and sdist>
publication:
  workflow: .github/workflows/publish.yml
  requires: an explicit release admission for the exact candidate; published digests equal admitted digests
  product_contract: publication mode fails closed unless the product contract is checked against authority.revision
  admission_gate: tools/assurance/verify_release_admission.py against docs/receipts/l9-memory-release-<version>.md on the default branch; runs before PyPI and stops on any mismatch of version, source revision, wheel or sdist sha256 (ADR-022, 2026-10-15)
hosted_service_admission:
  # Declared by the topology (admission.kind_specific_requirements: service_admitted).
  # Release admission resolves the requirement without admitting a running
  # service; only the applicable target-class authority admits an exact
  # running deployment, and deployment never self-admits it.
  declared_requirement: service_admitted
  states_ref: l9.product-kind-exception/memory-hosted-service@1
  separate_from:
    - release admission (l9.contract/product-release@1)
    - deployment
proofs:
  installed_artifact:
    - scripts/validate_release.sh (exact-wheel install, digest match, installed smoke)
    - tests/integration/test_installed_wheel_lifecycle.py
  migration:
    - tests/integration/test_projection_link_migration.py
    - tests/conformance/test_shared_canonical_store.py
    - tests/unit/test_backend_transition_guard.py
    - deployment/generated-data/verify_migration.py
  backup_restore:
    - deployment/generated-data/verify_backup_restore.py
    - tests/deployment/generated_data/test_backup_restore.py
  generated_data_invalidation:
    - deployment/generated-data/live_end_to_end_proof.py
    - deployment/generated-data/verify_selector_indexes.py
    - tests/deployment/generated_data/test_live_proof_fail_closed.py
  graphiti_live:
    status: no executable live proof entrypoint exists
    applies_when: the resolved ProductManifest declares the Graphiti MCP provider realization (topology target facts:v8:graphiti:primary, active)
  zep_shadow_live:
    status: no executable live proof entrypoint exists
    applies_when: the resolved ProductManifest declares the Zep shadow provider realization (topology target facts:v8:zep:primary, shadow)
  secrets:
    status: no executable secret loading or rotation proof entrypoint exists
    implementation: src/l9_graphite_memory/secrets.py
consumer_binding:
  target: Quantum-L9/Cursor-Governance
  phase: post_publication
  required_for_product_or_release_identity: false
  handoff_coordinates:
    - release version
    - exact source revision
    - wheel sha256
    - sdist sha256
    - CONTROL_PLANE_CONTRACT_VERSION
    - ProductTopology digest
    - ProductManifest digest
    - release admission ref
    - publication ref
