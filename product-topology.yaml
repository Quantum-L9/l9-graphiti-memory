identity:
  semantic_owner: l9-graphiti-memory:authority/memory-architecture
  semantic_scope: canonical_agent_memory_control_plane
  canonical_repository: Quantum-L9/l9-graphiti-memory
  dimensions:
    product:
      applicable: true
      value: l9-graphiti-memory:product/l9-graphite-memory
      distribution_name: l9-graphite-memory
      import_package: l9_graphite_memory
      authority_source: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-058-graphiti-repository-name-and-graphite-package-compatibility.md
    release:
      applicable: true
      identity_rule: release identity is the exact (PACKAGE_VERSION, source revision, wheel sha256, sdist sha256) tuple; a version string alone is never release identity
      version_source: src/l9_graphite_memory/version.py::PACKAGE_VERSION
      governing_contract_ref: l9.contract/product-release@1
    runtime:
      applicable: false
      inherits_from: consumer
      rule: RuntimeIdentity(dependency_instance) = RuntimeIdentity(consumer)
      rule_source_ref: l9.product-kinds/global@1
    constellation:
      applicable: false
      rule: no_independent_constellation_runtime_identity
      forbidden: independent_constellation_identity_as_dependency
      rule_source_ref: l9.product-kinds/global@1
    actor:
      applicable: true
      materiality: local_authorship_is_material
      reason: every canonical memory write is attributed authorship; the caller principal is derived server-side and never accepted from request payloads
      registry_ref: l9.actor-registry/global@1
      unknown_or_ambiguous_outcome: fail_closed
      authority_source: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-083-server-side-local-authorization-and-one-class-vocabulary.md
    surface:
      applicable: false
      reason: CLI, MCP, HTTP and SDK surfaces are transport adapters with lifecycle-operation parity into one MemoryService; a local surface does not change governance or projection semantics
      authority_source: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-082-consumer-control-plane-transport-parity.md
  bindings: []
  resolution:
    contract_ref: l9.contract/identity-resolution@1
    resolver_ref: l9-graphiti-memory:resolver/server-side-principal@1
    assertion_schema_ref: l9.schema/identity-assertion@1
