    - l9.contract/projection@1
    - l9.contract/evidence-and-receipt@1
  hard_constraints:
    - id: l9-graphiti-memory:constraint/memory-service-is-canonical@1
      class: semantic
      hardness: hard
      statement: MemoryService is the only production path for every memory write and read operation.
      source_ref: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-002-canonical-memory-service.md
    - id: l9-graphiti-memory:constraint/server-derived-caller-identity@1
      class: authority
      hardness: hard
      statement: Caller identity is derived server-side; a request never asserts its own principal.
      source_ref: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-083-server-side-local-authorization-and-one-class-vocabulary.md
    - id: l9-graphiti-memory:constraint/atomic-evidence-bearing-persistence@1
      class: semantic
      hardness: hard
      statement: Canonical persistence is atomic and evidence-bearing.
      source_ref: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-025-storage-source-of-truth-and-backend-partitioning.md
    - id: l9-graphiti-memory:constraint/bitemporal-distinction@1
      class: semantic
      hardness: hard
      statement: Valid time and transaction time remain distinct.
      source_ref: Quantum-L9/l9-graphiti-memory/AGENTS.md
    - id: l9-graphiti-memory:constraint/projections-are-not-canonical@1
      class: semantic
      hardness: hard
      statement: Graph and semantic provider state is a rebuildable projection and is never canonical memory.
      source_ref: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-063-projection-manifest-compiler-and-control-plane-boundaries.md
    - id: l9-graphiti-memory:constraint/no-write-bypass@1
      class: authority
      hardness: hard
      statement: Canonical store mutations require the MemoryService-issued write capability and are gated by the release-blocking bypass scanner.
      source_ref: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-036-canonical-write-bypass-enforcement.md
  soft_objectives: []
  operational_requirements:
    - id: l9-graphiti-memory:constraint/no-secret-persistence@1
      class: operational
      hardness: hard
      statement: Secrets enter only at runtime from operator environment or the secret provider; generated configuration never persists them.
      source_ref: Quantum-L9/l9-graphiti-memory/docs/adr/ADR-016-secret-and-credential-boundaries.md
  security_requirements:
    - id: l9-graphiti-memory:constraint/fail-closed-actor-attribution@1
      class: authority
      hardness: hard
      statement: Unknown or ambiguous actor identity fails closed for memory attribution.
      source_ref: L9-IDENTITY-005
  conformance_requirements:
    - l9.contract/conformance-resolution@1
capabilities:
  provides:
    - id: l9-graphiti-memory:capability/memory-admission@1
      semantic_owner: l9-graphiti-memory:authority/memory-architecture
      purpose: Admit candidate memory into canonical persistence under policy, phase-lock and identity checks.
    - id: l9-graphiti-memory:capability/memory-retrieval@1
      semantic_owner: l9-graphiti-memory:authority/memory-architecture
      purpose: Search and hydrate current canonical memory, with historical visibility only on explicit request.
    - id: l9-graphiti-memory:capability/memory-lifecycle@1
      semantic_owner: l9-graphiti-memory:authority/memory-architecture
      purpose: Transition canonical records through lifecycle states, including supersession, archival, retention and verified deletion.
    - id: l9-graphiti-memory:capability/memory-curation@1
      semantic_owner: l9-graphiti-memory:authority/memory-architecture
      purpose: Promote, distill, synthesize and maintain canonical memory.
    - id: l9-graphiti-memory:capability/memory-projection@1
      semantic_owner: l9-graphiti-memory:authority/memory-architecture
      purpose: Project canonical records to provider targets through the outbox, and retire, erase or rebuild them.
    - id: l9-graphiti-memory:capability/memory-receipts@1
      semantic_owner: l9-graphiti-memory:authority/memory-architecture
      purpose: Emit evidence-bearing receipts for every consequential memory operation.
  requires:
    - id: l9-graphiti-memory:requirement/consumer-process-host@1
      purpose: A consuming product hosts the process, injects deployment identity and owns process lifecycle.
      source_ref: l9.pattern/dependency-package@1
  optional:
    - id: l9-graphiti-memory:requirement/graph-projection-provider@1
      purpose: A graph provider realization for the memory projection port.
    - id: l9-graphiti-memory:requirement/shared-canonical-store@1
      purpose: A PostgreSQL canonical store when the deployment shares canonical memory across processes.
  degraded_without:
    - id: l9-graphiti-memory:requirement/graph-projection-provider@1
      purpose: Without a provider, canonical memory remains complete and projection targets stay disabled.
  forbidden: []
