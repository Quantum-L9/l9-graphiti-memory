    - Quantum-L9/l9-graphiti-memory/docs/adr/ADR-001-repository-role-and-boundaries.md
  semantic_boundary_refs:
    - l9.contract/semantic-ownership@1
  trust_boundary_refs:
    - Quantum-L9/l9-graphiti-memory/docs/adr/ADR-016-secret-and-credential-boundaries.md
  transaction_boundary_refs:
    - Quantum-L9/l9-graphiti-memory/docs/adr/ADR-002-canonical-memory-service.md
  mutation_boundary_refs:
    - Quantum-L9/l9-graphiti-memory/docs/adr/ADR-036-canonical-write-bypass-enforcement.md
requirements:
  invariant_refs:
    - L9-AUTH-001
    - L9-OWNER-001
    - L9-SEM-001
    - L9-UNKNOWN-001
    - L9-PROV-001
    - L9-IDENTITY-001
    - L9-IDENTITY-005
