  successor_refs: []
  supersedes: []
purpose:
  statement: Canonical, domain-agnostic agent memory control plane. One MemoryService admits, persists, retrieves, curates and retires memory records under server-derived identity, with graph and semantic providers held as rebuildable projections.
  capability_refs:
    - l9-graphiti-memory:capability/memory-admission@1
    - l9-graphiti-memory:capability/memory-retrieval@1
    - l9-graphiti-memory:capability/memory-lifecycle@1
    - l9-graphiti-memory:capability/memory-curation@1
    - l9-graphiti-memory:capability/memory-projection@1
    - l9-graphiti-memory:capability/memory-receipts@1
  primary_responsibility: Own the semantics of agent memory and expose them through one canonical control plane composed into a consumer's process.
  objectives:
    - one canonical write and read path through MemoryService
    - atomic, evidence-bearing canonical persistence
    - valid time and transaction time kept distinct
    - provider-neutral projections that never become canonical
  non_goals:
    - agent execution or checkpoint orchestration
    - constellation routing or Gate routing authority
    - business-domain semantics
    - an independent runtime or constellation identity
boundary:
  owns:
    - memory contracts
    - memory authorization policy
    - memory admission
    - canonical memory persistence semantics
    - memory lifecycle semantics
    - memory retrieval semantics
    - memory curation
    - memory receipts
    - memory SDK, CLI and MCP product surfaces
    - memory provider ports
    - memory projection semantics
    - memory compatibility policy
  does_not_own:
    - agent execution
    - world-model semantics
    - cross-node routing
    - Gate routing authority
    - consumer runtime identity
    - business-domain semantics
    - provider semantics
    - Cursor-Governance semantics
    - Graphiti semantics
    - Zep semantics
  authority_boundary_refs:
