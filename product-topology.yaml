schema: l9.product-topology/v1
# Authoritative ProductTopology for Quantum-L9/l9-graphiti-memory (ADR-094).
# Global law is consumed, never copied: every `l9.*` reference resolves in
# Quantum-L9/.github at the revision pinned under `provenance`. References in
# the `l9-graphiti-memory:` namespace are product-owned semantics whose
# authority is this repository (see unknowns.non_material: NM-001).
product:
  id: l9-graphiti-memory:product/l9-graphite-memory
  kind: dependency
  archetype_ref: l9.dependency-archetype/semantic-subsystem@1
  name: l9-graphite-memory
