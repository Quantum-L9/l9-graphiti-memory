# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/l9-graphiti-memory
#   path: pyproject.toml
#   layer: repository
#   owner: memory-control-plane
#   status: active
#   version: 2.2.0
#   updated: 2026-07-22

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l9-graphite-memory"
version = "2.2.0"
description = "Contract-governed bi-temporal memory substrate for autonomous agents"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
authors = [{ name = "Quantum-L9" }]
keywords = [
  "agent-memory",
  "bi-temporal",
  "graphiti",
  "knowledge-graph",
  "mcp",
  "temporal-memory",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
active = ["redis>=5,<7"]
postgres = ["psycopg2-binary>=2.9,<3"]
zep = ["zep-cloud>=3.0,<4"]
phase6 = [
  "cryptography>=46.0,<47",
  "jsonschema>=4.26,<5",
  "PyJWT>=2.13,<3",
]
infisical = ["infisical-python>=2.0,<3"]
constellation = [
  "constellation-node-sdk @ git+https://github.com/Quantum-L9/Gate_SDK.git@v1.0.1 ; python_full_version >= '3.12'",
]
all = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg2-binary>=2.9,<3",
  "redis>=5,<7",
  "zep-cloud>=3.0,<4",
  "infisical-python>=2.0,<3",
]
dev = [
  "build>=1.2,<2",
  # mypy reads the same source whether or not these are importable, but not the
  # same result: server.py guards the starlette import with a `type: ignore`
  # fallback, which mypy reports as an unused ignore once the real import is
  # missing. ci.yml already installs --extra server alongside dev, so this only
  # closes the gap for a caller that installs `.[dev]` alone -- the org's seeded
  # lint job does exactly that.
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=46.0,<47",
  "jsonschema>=4.26,<5",
  "PyJWT>=2.13,<3",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=0.23,<1",
  "psycopg2-binary>=2.9,<3",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  # CI already runs `uv sync --extra dev`. Installing the constellation extra
  # here makes constellation-node-sdk contract tests run instead of skip.
  "constellation-node-sdk @ git+https://github.com/Quantum-L9/Gate_SDK.git@v1.0.1 ; python_full_version >= '3.12'",
]

[project.scripts]
l9-memory = "l9_graphite_memory.cli:main"
l9-memory-server = "l9_graphite_memory.server:main"
l9-memory-worker = "l9_graphite_memory.services.outbox_worker:main"

[project.urls]
Homepage = "https://github.com/Quantum-L9/l9-graphiti-memory"
Repository = "https://github.com/Quantum-L9/l9-graphiti-memory"
Issues = "https://github.com/Quantum-L9/l9-graphiti-memory/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
l9_graphite_memory = [
  "resources/*.yaml",
  "resources/projections/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["validation", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"src/l9_graphite_memory/secrets.py" = ["S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
markers = [
  "integration: tests spanning multiple production components",
  "live: tests requiring external services and credentials",
]

[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["validation", "dist", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "infisical_client.*", "zep_cloud.*", "fastapi.*", "uvicorn.*", "redis.*", "psycopg2.*", "constellation_node_sdk", "constellation_node_sdk.*"]
ignore_missing_imports = true

[tool.uv]
# Lock all declared extras so CI/dev can `uv sync --frozen --extra …` without
# re-resolving. Published wheels/sdists remain pip-installable without uv.
package = true
