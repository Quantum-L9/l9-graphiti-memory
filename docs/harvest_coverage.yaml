    adr_paths: [docs/adr/ADR-013-transport-abstraction-and-vendor-neutrality.md, docs/adr/ADR-057-verified-deletion-and-projection-erasure.md]
  - id: H-043
    concept: Hosted Ruff strict mypy CodeQL branch-protection and release-environment proof
    sources: [current_repo_audit, final_validation]
    status: blocked_external
    blocker: Ruff and mypy are not available in the offline build environment; CodeQL branch protection and release environments require GitHub-hosted execution and repository settings inspection.
    adr_paths: [docs/adr/ADR-021-testing-and-adapter-conformance.md, docs/adr/ADR-022-release-publishing-and-rollback.md]
  - id: H-044
