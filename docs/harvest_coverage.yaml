  - id: H-036
    concept: TransportPacket as the constellation inter-node boundary
    sources: [legacy_memory_pack, l9_platform]
    status: rejected_boundary
    rationale: This dependency package owns memory contracts and adapters, not constellation inter-node transport. It must consume the canonical TransportPacket contract from its owner rather than define a deprecated envelope or duplicate TransportPacket.
    adr_paths: [docs/adr/ADR-026-transportpacket-constellation-boundary.md]
  - id: H-037
    concept: Agent checkpoints execution plans world model updates and reasoning orchestration inside the memory write path
    sources: [legacy_memory_pack, original_repo]
    status: rejected_boundary
    rationale: These are downstream consumers of committed memory events. Core persistence must not depend on agent execution, world-model, or reasoning services.
    adr_paths: [docs/adr/ADR-028-agent-checkpointing-boundary.md, docs/adr/ADR-046-core-commit-versus-asynchronous-enrichment.md]
  - id: H-038
    concept: Duplicate memory control plane inside L9-Ops-MCP
    sources: [l9_ops_commit_pack]
    status: rejected_boundary
    rationale: L9-Ops-MCP may proxy or orchestrate memory operations but must not own a parallel memory server, admission engine, or durable store.
    adr_paths: [docs/adr/ADR-001-repository-role-and-boundaries.md, docs/adr/ADR-038-sdk-mcp-cli-and-http-surface.md]
  - id: H-039
    concept: Mandatory PostgreSQL Redis Neo4j OpenAI LangGraph and broad cognitive runtime dependencies
    sources: [legacy_memory_pack, original_repo]
    status: rejected_boundary
    rationale: The canonical dependency package remains backend-neutral and locally operable. Optional projections and enrichment providers are adapters, not mandatory foundations.
    adr_paths: [docs/adr/ADR-001-repository-role-and-boundaries.md, docs/adr/ADR-025-storage-source-of-truth-and-backend-partitioning.md]
  - id: H-040
    concept: Raw private chat histories and user-specific memory fixtures in the repository
    sources: [legacy_memory_pack, memory_packs]
    status: rejected_boundary
    rationale: Only sanitized contract fixtures belong in source control. Private memory content must remain outside the repository and enter through consent-governed ingestion.
    adr_paths: [docs/adr/ADR-034-private-data-fixtures-and-repository-hygiene.md]
