name: Bot interop package

on:
  pull_request:
    paths:
      - 'packages/bot-interop/**'
      - '.github/workflows/bot-interop.yml'
  push:
    branches: [main]
    paths:
      - 'packages/bot-interop/**'
      - '.github/workflows/bot-interop.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bot-interop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: npm
          cache-dependency-path: packages/bot-interop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify:all
