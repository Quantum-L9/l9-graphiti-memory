# See LLM-Router/files/.github/workflows/memory-stack-dependency-gate.yml
# for the rationale. Website-Bot depends on both upstream layers by exact
# version; @quantum-l9/bot-interop itself is a local workspace package
# (file:packages/bot-interop), not a registry dependency, so it is not
# checked here.
name: Memory stack dependency gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  dependency-resolvable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
      - name: Require @quantum-l9/graphiti-memory-client@2.0.0 on the registry
        run: npm view @quantum-l9/graphiti-memory-client@2.0.0 version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require @quantum-l9/llm-router@1.1.0 on the registry
        run: npm view @quantum-l9/llm-router@1.1.0 version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
