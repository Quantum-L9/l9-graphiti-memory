  - 'src/l9_graphite_memory/maintenance/service.py :: _load (ACTIVE only, limit=max_records, recorded_at<=watermark)'
  - 'src/l9_graphite_memory/maintenance/planner.py :: _plan_archive (candidates = eligible - consumed)'
  violated_contract: 'RetentionEngine contract: ''record remains referenced; exclude from active retrieval but preserve linkage''
    (soft-expire)'
  preconditions: 'Expired record referenced by a record that is outside the window: newer than watermark, beyond max_records,
    non-ACTIVE, or in another namespace.'
  expected_behavior: soft-expire
