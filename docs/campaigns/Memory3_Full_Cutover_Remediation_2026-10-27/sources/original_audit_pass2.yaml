- id: F-001
  severity: HIGH
  status: CONFIRMED
  title: Graphiti tool failures flagged with MCP isError are recorded as successful projections with a durable link
  repository_revision: eb0bcbed1e1652529675af52584185d2f09dd737
  source_location:
  - 'src/l9_graphite_memory/transport.py :: HttpMcpTransport.call_tool (content[0].text parsed; isError never read)'
  - 'src/l9_graphite_memory/transport.py :: write (str result wrapped as {''result'': text})'
  - 'src/l9_graphite_memory/adapters/graphiti_projection.py :: _settle_write (checks only ''error'' key; falls back to episode_name_locator)'
  - 'src/l9_graphite_memory/services/outbox_worker.py :: run_once project branch'
  violated_contract: AGENTS.md invariant 3 / ADR-074 / MCP tools/call result contract (isError)
  preconditions: 'Graphiti answers tools/call with {content:[{type:''text'',text:''Error: ...''}], isError:true}.'
  expected_behavior: call_tool raises ProjectionError; event RETRY/DEAD; no link.
  actual_behavior: 'Error text returned as str -> {''result'': ...} -> no ''error'' key -> name locator synthesized -> link
    installed, event DELIVERED.'
  evidence:
  - Source trace at eb0bcbed1e1652529675af52584185d2f09dd737
  - clients/typescript/src/index.ts throws on result.isError; Python transport does not
  - 'search_code ''isError'' under src: no handling'
  root_cause: call_tool unwraps content without consulting the result envelope's isError flag.
  affected_components:
  - transport.HttpMcpTransport
  - GraphitiProjection
  - OutboxWorker
  - deletion/retirement lifecycle
  impact: Silent projection loss; later erase fails closed and dead-letters; verified deletion stays DELETION_PENDING indefinitely.
  reproduction: NOT_EXECUTED (needs fixture emitting isError)
  existing_validation_gap: test_graphiti_http_projection_loop.py fake never returns isError.
  recommended_correction: Raise ProjectionError when result.get('isError'); record circuit failure.
  regression_requirements:
  - 'Unit: isError => ProjectionError'
  - 'Integration: isError on add_memory => RETRY, no projection_links row'
  reconciliation: 'Revalidated pass 2: remote_client.py also lacks isError handling; Zep path unaffected. HIGH retained.'
