      pops ''metadata'' explicitly; HttpMcpTransport.write forwards it verbatim.'
  U-003:
    disposition: DISPROVEN
    detail: 'No consumer filters on temporal.superseded_at (search_code over src excluding adapters: only schema/upcasters
      and contracts). In-memory and SQLite adapters behave identically. Residual: cosmetic stale field on restored records.'
  U-004:
