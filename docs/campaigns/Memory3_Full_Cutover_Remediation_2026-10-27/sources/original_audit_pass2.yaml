- id: F-009
  severity: MEDIUM
  status: CONFIRMED
  title: Canonical lifecycle mutation complete_deletion (and link/retirement writes) bypass the ServiceWriteCapability gate
  repository_revision: eb0bcbed1e1652529675af52584185d2f09dd737
  source_location:
  - 'src/l9_graphite_memory/ports/record_store.py :: complete_deletion, update_outbox, save_projection_link, save_projection_link_if_active,
    delete_projection_link, save_projection_retirement, save_maintenance_run (no capability parameter)'
  - 'src/l9_graphite_memory/services/outbox_worker.py :: run_once erase branch calls store.complete_deletion(...) directly;
    maintenance/service.py :: store.save_maintenance_run'
  violated_contract: 'AGENTS.md invariant 6: ''Canonical store mutations require the MemoryService-issued write capability
    at run time''; ports/service_capability.py docstring lists verified deletion among gated mutations'
  preconditions: Any in-process caller holding a RecordStore reference.
  expected_behavior: DELETION_PENDING->DELETED transition and its status event are only reachable through a capability-bearing
    call.
  actual_behavior: complete_deletion appends a DELETED status event and flips record state with no capability; OutboxWorker
    performs it outside MemoryService.
  evidence:
  - Port signatures at eb0bcbed1e1652529675af52584185d2f09dd737
  - outbox_worker.run_once source
  root_cause: Capability gate was applied to commit_* methods only; completion of deletion was treated as worker plumbing.
  affected_components:
  - ports.RecordStore
  - OutboxWorker
  - all three store adapters
  impact: Invariant 6 is false as stated; bypass scanner cannot catch direct complete_deletion calls; defense-in-depth gap.
  reproduction: NOT_EXECUTED (contract/source comparison)
  existing_validation_gap: 'None: no test asserts capability on complete_deletion.'
  recommended_correction: Either add the capability parameter to complete_deletion (worker obtains it via a MemoryService
    method) or amend invariant 6/ADR-036 to enumerate worker-owned mutations explicitly.
  regression_requirements:
  - 'Unit: complete_deletion without capability raises PermissionError (if option 1).'
  - 'Docs: invariant text matches implementation (if option 2).'
- id: F-010
  severity: MEDIUM
  status: CONFIRMED
  title: PII regexes irreversibly redact non-PII numerics (Unix epochs, 9-digit identifiers); only redacted content is persisted
  repository_revision: eb0bcbed1e1652529675af52584185d2f09dd737
  source_location:
  - 'src/l9_graphite_memory/admission/normalization.py :: _PII_PATTERNS phone/ssn'
  - 'src/l9_graphite_memory/services/memory_service.py :: _admit (content=normalization.redacted_content)'
  violated_contract: UNKNOWN (no ADR located); contradicts 'content-immutable canonical record' intent — original content
    is never stored
  preconditions: Content containing a 10-digit number (e.g. epoch 1761573600) or 9-digit number.
  expected_behavior: Only genuine phone/SSN values redacted; or original retained alongside.
  actual_behavior: '''deploy finished at 1761573600'' -> ''deploy finished at [PHONE_REDACTED]''; ''Jira ticket 123456789''
    -> ''[SSN_REDACTED]''. Record carries pii_types=[''phone''] and the normalized digest collides across different epochs.'
  evidence:
  - Reproduced in sandbox with the verbatim patterns.
  root_cause: Over-broad regexes with no context check; redaction applied before persistence with no original copy.
  affected_components:
  - admission.normalization
  - MemoryService._admit
  - quarantine review payload (pii_redacted)
  impact: Silent canonical data loss for operational memories (timestamps, ticket ids); dedupe digest collisions.
  reproduction: VERIFIED
  existing_validation_gap: No negative tests for false positives.
  recommended_correction: Tighten patterns (require separators/plus for phone; reject pure 10-digit integers), or store original_content
    encrypted/sealed; at minimum warn rather than mutate for low-confidence matches.
  regression_requirements:
  - 'Unit: epoch and 9-digit ids are not redacted; real phone/SSN still are.'
