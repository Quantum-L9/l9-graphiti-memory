planning_notes:
- Source code, CI results, and pull request merges are not C1 deployment evidence.
- The Cog staging contract reserves port 18080 and its hostname; do not assume its live runtime state.
- 3.0 source version is merged, but an exact 3.0 release and tag were not verified.
- The Memory product-kind exception does not authorize running service admission by itself.
- Existing stale READMEs describing PR96 as unmerged are superseded by main source and merged PR evidence.
- C1 identity, legacy Memory 2.2.0, Graphiti, Neo4j and VM backup posture are grounded by authorized October 13 recon,
  not assumed current live.
- Only current-state freshness and new Memory PostgreSQL/secrets/restore preflight remain at A3; do not restart host
  discovery.
- The legacy Graphiti public MCP tool listing accepted unauthenticated calls on October 13; current exposure is unknown
  and belongs to separate scoped security handling.
- A verified Cognitive Runtime release v2 request reached and passed l9-deploy validation on October 23; reuse Core producer,
  do not build a redundant one.
- Governed Claude Mobile/Cursor bridge cutover would touch a consumer authority outside the four write-scoped repos,
  requiring separately scoped approval.
- October 26 operator explicitly authorized deleting and replacing the legacy C1 Memory 2.2.0 service/SQLite after verifying
  the old backup; no additional old-backup restore test required.
- Reusing existing TLS hostname memory.quantumaipartners.com and loopback 8200 is the simplest target after live Caddy
  ownership checks; 8100 Graphiti and 18080 Cognitive Runtime remain protected.
- New PostgreSQL data-backup and restore acceptance is distinct from the verified old SQLite backup and remains an operational
  requirement.
- Do not disable or delete the old Memory service until the new Memory 3.0 image, PostgreSQL, vault grants and l9-deploy
  execution route are ready; then controlled switch and verify before removing obsolete files.
