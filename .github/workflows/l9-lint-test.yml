# L9 consumer lint + test workflow — ACTIVATED for Quantum-L9/l9-graphiti-memory.
#
# Seeded from the l9-ci-pack Core hub and activated here (SOURCE_DIR, lint
# policy, toolchain pin). It is not executed from l9-ci-core.
#
# It deliberately lives consumer-side: l9-ci-core v2 is a thin control plane
# whose workflow set is fixed by `tests/workflows/test_phase_scope.py`. Generic
# ruff / mypy / pytest *config* is owned by the consuming repository; *versions*
# come from the install-consumer-ci action. Do not write version literals here.
#
# Toolchain pin: the template shipped `install-consumer-ci@v2`, which does not
# resolve — l9-ci-core has no v2 tag (v1, v1.0.0, v0.1.0 only), and the action
# is absent from v1, so @v1 fails too. Both jobs died in `Set up job` with
# "Unable to resolve action ... unable to find version `v2`" and never started.
# Pinned to the l9-ci-core main commit that carries the action, which also
# satisfies the SHA-pinning convention below. Repoint when a real tag exists.
#
# v2 conventions preserved here:
#   - immutable event-revision checkout (no floating action ref)
#   - external actions pinned to full commit SHAs
#   - explicit least-privilege permissions (contents: read, no write scopes)
name: L9 Lint and Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# ── Consumer config: edit these values for your repo ───────────────────────────
env:
  PYTHON_VERSION: "3.12"
  SOURCE_DIR: "src/l9_graphite_memory"
  TEST_DIR: "tests/"
  # Fail the build below this line coverage percentage. 0 = advisory (no gate).
  COVERAGE_THRESHOLD: "0"

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install consumer CI toolchain
        uses: Quantum-L9/l9-ci-core/.github/actions/install-consumer-ci@7148fc73dcbf41367f5c5401432dc997b1f4f869  # main
      - name: Install extra CI requirements
        run: |
          set -euo pipefail
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
      - name: ruff check
        run: ruff check . --output-format=github
      # No `ruff format --check` step. This repository has never been
      # ruff-format clean (118 files would be reformatted, 26 of them under
      # SOURCE_DIR) and its owned gate, .github/workflows/ci.yml, deliberately
      # runs `ruff check` only. This template states that generic ruff / mypy /
      # pytest *config* is owned by the consuming repository, so activation
      # matches the repo's lint policy rather than adding a second, red one.
      # Adopting format enforcement is a separate decision with a 118-file diff.
      - name: mypy
        run: |
          mypy "${SOURCE_DIR}" \
            --show-error-codes --pretty \
            --install-types --non-interactive --ignore-missing-imports

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install consumer CI toolchain
        uses: Quantum-L9/l9-ci-core/.github/actions/install-consumer-ci@7148fc73dcbf41367f5c5401432dc997b1f4f869  # main
      - name: Install test tools
        run: |
          set -euo pipefail
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
          pip install -e ".[dev]" || pip install -e . || \
            echo "::notice::no local editable package to install"
          python -c "import pytest_cov" 2>/dev/null || pip install pytest-cov
          python -c "import xdist" 2>/dev/null || pip install pytest-xdist
          python -c "import pytest_timeout" 2>/dev/null || pip install pytest-timeout
      - name: pytest with coverage
        env:
          TESTING: "true"
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest "${TEST_DIR}" \
            -n auto \
            --cov="${SOURCE_DIR}" \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_THRESHOLD}" \
            --timeout=300 --tb=short -v
