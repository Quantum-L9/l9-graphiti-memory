# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/l9-graphiti-memory
#   path: .github/workflows/publish.yml
#   layer: ci
#   owner: memory-control-plane
#   status: active
#   version: 2.3.0
#   updated: 2026-09-07

name: Publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Sync locked environment
        run: uv sync --frozen --no-install-project --no-build --extra dev --extra server
      - name: Put uv venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Expose src on PYTHONPATH
        run: echo "PYTHONPATH=$PWD/src${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: mypy src/l9_graphite_memory
      - run: bash scripts/validate_release.sh
      # Release evidence (audit P1-01): the published artifacts must be
      # byte-identical to the wheel the consumer proved against this commit
      # (Cursor-Governance ops/config/memory-binding.json release_evidence,
      # built with `uv build --wheel` under the same epoch). setuptools takes
      # zip timestamps from SOURCE_DATE_EPOCH; without it every build has a new
      # digest and no consumer pin can assert the published wheel.
      - name: Build release artifacts (reproducible)
        env:
          SOURCE_DATE_EPOCH: "1784592000"
        run: python -m build --outdir dist
      - name: Record artifact digests
        run: |
          {
            echo "## Release artifacts (SOURCE_DATE_EPOCH=1784592000)"
            echo
            echo '```'
            sha256sum dist/*
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/
            validation/
            CHANGE_SUMMARY.md
            MANIFEST.md
            VALIDATION.md
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/v')
