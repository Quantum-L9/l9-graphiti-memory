# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/l9-graphiti-memory
#   path: .github/workflows/publish.yml
#   layer: ci
#   owner: memory-control-plane
#   status: active
#   version: 2.5.1
#   updated: 2026-11-13

name: Publish
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated v* tag to publish
        required: true
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment: release
    # `validate_release.sh` derives the V-001 suite proof (ADR-101). Its `ci`
    # skip profile refuses a lost PostgreSQL or Redis backend, so a publish
    # job must provision the same backends as CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: l9memtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      L9_MEMORY_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres dbname=l9memtest
      L9_MEMORY_TEST_REDIS_URL: redis://localhost:6379/0
      # Reproducible build epoch (audit P1-01): the build entry point stamps
      # every wheel and sdist member with SOURCE_DATE_EPOCH, so the digests
      # recorded below are stable for a consumer pin. Reproducibility is not artifact identity, though: the
      # bytes published are the bytes validated because they are the SAME
      # files, built once below and handed to validation and publication.
      SOURCE_DATE_EPOCH: "1784592000"
      # The artifact set is built once into dist/. Validation inspects exactly
      # that directory (publication mode: no rebuild) and publication uploads
      # exactly that directory.
      L9_RELEASE_ARTIFACT_DIR: dist
      L9_RELEASE_EVIDENCE_DIR: build/release-validation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Manual dispatches run this workflow from the default branch. Check
          # out the immutable tag so validation and publication use its source.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          # Full history: V-001 (ADR-101) compares the collected test set with
          # its merge-base against origin/main. A shallow tag checkout has no
          # origin/main, so the check would be UNKNOWN and block every release.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sync locked environment
        run: uv sync --frozen --no-install-project --no-build --extra dev --extra server --extra postgres --extra active
      - name: Put uv venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Expose src on PYTHONPATH
        run: echo "PYTHONPATH=$PWD/src${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: mypy src/l9_graphite_memory
      # The one and only build of the release artifact set. Nothing after
      # this step builds; validation and publication consume these files.
      # scripts/build_release_artifacts.sh is the repository's single build
      # recipe (also used by release-container.yml and validate_release.sh):
      # it makes the wheel and sdist byte-reproducible for this commit and
      # SOURCE_DATE_EPOCH, so they can equal the digests an admission receipt
      # recorded before the tag.
      - name: Build release artifacts once (wheel and sdist)
        run: bash scripts/build_release_artifacts.sh dist
      - name: Record candidate artifact digests
        run: sha256sum dist/* | tee build-digests.txt
      # ADR-094: publication checks the product contract against the same
      # pinned semantic authority as CI (release binding authority.revision);
      # validate_release.sh fails closed in publication mode without it.
      - name: Check out the bound semantic authority
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Quantum-L9/.github
          ref: d4397e53f8f4c23458a80f87db9552463ad9e26f
          path: build/semantic-authority
          persist-credentials: false
      - name: Validate the exact release artifact set
        run: bash scripts/validate_release.sh
        env:
          L9_SEMANTIC_AUTHORITY_ROOT: build/semantic-authority
      - name: Prove the validated artifact set is the publication set
        run: |
          set -euo pipefail
          sha256sum dist/* | diff - build-digests.txt
          diff <(cut -d' ' -f1 build-digests.txt | sort) \
               <(cut -d' ' -f1 build/release-validation/SHA256SUMS | sort)
          {
            echo "## Release artifacts (SOURCE_DATE_EPOCH=1784592000)"
            echo
            echo "Built once, validated as-is, published as-is."
            echo
            echo '```'
            cat build-digests.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            dist/
            build-digests.txt
            build/release-validation/
            CHANGE_SUMMARY.md
            VALIDATION.md
      # Release admission (ADR-094; ADR-022, 2026-10-15). The `release`
      # environment approval says a person allowed this run; it names no
      # version or digest, so it is not the admission decision. Publication
      # requires the receipt that admits this exact version, source revision,
      # wheel sha256 and sdist sha256, read from the protected default branch,
      # never from the candidate's own tree. No receipt, or any mismatch, stops
      # the job before PyPI; the observed tuple is printed for the authority.
      - name: Check out the release admission record (default branch)
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: build/release-admission
          persist-credentials: false
      - name: Verify the exact-release admission
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from l9_graphite_memory.version import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          python tools/assurance/verify_release_admission.py \
            --admission-root build/release-admission \
            --artifact-dir dist \
            --version "$VERSION" \
            --source-revision "$(git rev-parse HEAD)" \
            --tag "$RELEASE_TAG"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
        with:
          packages-dir: dist/
          print-hash: true
