# Mirrors .github/workflows/publish.yml (the Python package's own release
# workflow): a pushed tag is the explicit human action, and the `release`
# GitHub Environment supplies the approval gate via required reviewers
# instead of a workflow_dispatch boolean input that is easy to forget to
# set. Uses a distinct tag prefix (client-v*) so it never collides with the
# Python package's v* release tags in the same repository.
name: Publish TypeScript memory client

on:
  push:
    tags: ['client-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm ci
      - run: npm run verify:all
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
