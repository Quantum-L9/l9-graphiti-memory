# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/l9-graphiti-memory
#   path: .github/workflows/ci.yml
#   layer: ci
#   owner: memory-control-plane
#   status: active
#   version: 2.4.0
#   updated: 2026-09-27

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    # The shared canonical store is the production backend (ADR-072), so CI
    # runs the store, ledger, outbox-lease, and maintenance matrices against a
    # real PostgreSQL instance. Without it those cases skip and the suite would
    # report green while never exercising the backend deployments actually use.
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway per-job container reachable only from this job, so it
          # carries no password to commit. Production deployments use a real
          # credential resolved from the runtime secret path (ADR-072).
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: l9memtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The active-memory adapter conformance suite runs against the
      # reference in-memory adapter and, with this service, against the real
      # Redis adapter, so the lease, expiry, and deployment-scope contract is
      # proven on the backend deployments use (ADR-065..068). Without the URL
      # the Redis leg skips loudly, like the PostgreSQL matrix.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      L9_MEMORY_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres dbname=l9memtest
      L9_MEMORY_TEST_REDIS_URL: redis://localhost:6379/0
      # Empty unless the repository holds the secret; gates the CI-based
      # SonarQube Cloud step below. Never echoed, never written to a file.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: SonarQube Cloud new-code detection and blame need it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync locked environment
        run: uv sync --frozen --no-install-project --no-build --extra dev --extra server --extra postgres --extra active
      - name: Put uv venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Expose src on PYTHONPATH
        run: echo "PYTHONPATH=$PWD/src${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: mypy src/l9_graphite_memory
      - name: Test active-memory subsystem
        run: PYTHONPATH=src pytest tests/unit/active tests/conformance/active tests/external_runtime -v
      - name: Gate active-memory public API
        run: PYTHONPATH=src python tools/assurance/check_active_memory_public_api.py
      - run: bash scripts/validate_release.sh
      # Release evidence (audit P2-03): a coverage report the release-analysis
      # tooling can map to new code. Collected as a separate run against the
      # full suite so the evidence generator's exact "N passed" pin above is
      # untouched; coverage.xml is uploaded next to the validation manifest.
      - name: Collect coverage report
        run: >-
          PYTHONPATH=src pytest -q -p no:cacheprovider
          --cov=l9_graphite_memory --cov-branch
          --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-py${{ matrix.python-version }}
          path: validation/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      # CI-based SonarQube Cloud analysis (audit P2-03): maps coverage.xml to
      # new code, which Automatic Analysis cannot. SonarCloud refuses a CI scan
      # while the project's Automatic Analysis is enabled ("You are running CI
      # analysis while Automatic Analysis is enabled", scanner exit 3), so the
      # gate is SonarCloud's own analysis-method state, not the mere presence
      # of the token: the probe reads `autoscanEnabled` for the project and the
      # scan runs only when it is false. The operator switch (project
      # Administration -> Analysis Method -> Automatic Analysis off) therefore
      # turns this step on with no workflow change; until then the SonarCloud
      # GitHub App keeps reporting through Automatic Analysis and the skip is
      # printed as a warning rather than hidden.
      - name: Probe SonarQube Cloud analysis method
        id: sonar_mode
        if: matrix.python-version == '3.13' && env.SONAR_TOKEN != ''
        run: |
          set -euo pipefail
          url="https://sonarcloud.io/api/navigation/component?component=Quantum-L9_l9-graphiti-memory"
          if ! resp="$(curl -sS --fail --max-time 30 -u "${SONAR_TOKEN}:" "$url")"; then
            echo "ci_analysis=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarQube Cloud analysis-method probe failed; CI-based scan skipped this run"
            exit 0
          fi
          if printf '%s' "$resp" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("autoscanEnabled") is False else 1)'; then
            echo "ci_analysis=on" >> "$GITHUB_OUTPUT"
          else
            echo "ci_analysis=off" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarQube Cloud Automatic Analysis is still enabled for Quantum-L9_l9-graphiti-memory; CI-based scan skipped (project Administration -> Analysis Method -> Automatic Analysis off to switch)"
          fi
      - name: SonarQube Cloud analysis (CI-based, coverage-aware)
        if: steps.sonar_mode.outputs.ci_analysis == 'on'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.organization=quantum-l9
            -Dsonar.projectKey=Quantum-L9_l9-graphiti-memory
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.10,3.13
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # RP-001/RP-002 bind this package to the authoritative TransportPacket and
  # Gate client, but the `validate` matrix omits the `constellation` group, so
  # every pytest.importorskip("constellation_node_sdk") case skipped on both
  # legs. An unavailable tag or an incompatible SDK API could still produce a
  # green release validation while the binding was marked bound: asserted,
  # never exercised (issue #39).
  #
  # A separate job rather than a fourth extra on `validate`, for two reasons.
  # An SDK outage fails a check that names the SDK instead of turning the whole
  # release-validation matrix red; and `validate` keeps skipping these cases, so
  # the V-001 execution count in tools/assurance/generate_validation_evidence.py
  # stays put instead of moving every time this job changes.
  constellation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The group is gated `python_full_version >= '3.12'`, so the matrix's
          # 3.10 leg could never carry it. This job pins the supported leg.
          python-version: '3.13'
      - name: Sync the constellation group
        # No --no-build here, unlike `validate`: the SDK is a git source
        # distribution with no wheel, and --no-build refuses it outright with
        # "can't be installed because it is marked as `--no-build` but has no
        # binary distribution". uv.lock pins the exact commit behind the tag,
        # so building it is not fetching arbitrary code.
        run: uv sync --frozen --no-install-project --extra dev --group constellation
      - name: Prove the SDK is importable
        # The failure this job exists to catch is a SILENT skip. Import it
        # explicitly first so a missing or broken SDK fails a step that names
        # it, instead of quietly turning the contract tests into no-ops.
        run: PYTHONPATH=src .venv/bin/python -c "import constellation_node_sdk"
      - name: Every SDK-bound test file is covered by this job
        # Guards the same failure one level up: a new file that binds the SDK
        # must be added below, or it would skip in `validate` and never run
        # here. A set comparison, deliberately not a pinned count.
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            tests/unit/test_canonical_gate_client.py \
            tests/unit/test_canonical_transport_packet.py | sort)"
          actual="$(grep -rl 'importorskip("constellation_node_sdk")' tests/ | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "SDK-bound test files changed; update this job's test list." >&2
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Run the constellation contract tests
        run: |
          PYTHONPATH=src .venv/bin/python -m pytest \
            tests/unit/test_canonical_transport_packet.py \
            tests/unit/test_canonical_gate_client.py -q

  # GI-080 proof in CI (ADR-093). The live graph-intelligence suites need a
  # Neo4j with GDS; without one they skip, so `validate` reports them as
  # skipped and they were proven only on a developer machine. This job gives
  # them the backend and fails if any of them skips.
  #
  # A separate job for the same reasons as constellation-contract: a Neo4j or
  # GDS download outage fails a check that names the graph backend, and the
  # V-001 execution count pinned for `validate` stays put.
  graph-live:
    runs-on: ubuntu-latest
    services:
      neo4j:
        # The image tag pins the GDS plugin the entrypoint installs:
        # Neo4j 5.26.31 -> GDS 2.13.13 (the qualified pair).
        image: neo4j:5.26.31
        env:
          # Throwaway per-job container reachable only from this job; the
          # password is derived per run and never committed.
          NEO4J_AUTH: neo4j/l9-ci-${{ github.run_id }}
          NEO4J_PLUGINS: '["graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: gds.*
          NEO4J_dbms_security_procedures_allowlist: gds.*
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s
    env:
      L9_MEMORY_TEST_NEO4J_URI: bolt://localhost:7687
      L9_MEMORY_TEST_NEO4J_USER: neo4j
      L9_MEMORY_TEST_NEO4J_PASSWORD: l9-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Sync locked environment
        run: uv sync --frozen --no-install-project --no-build --extra dev
      - name: Wait for Bolt and GDS
        # The HTTP health check can pass before Bolt accepts sessions and before
        # the GDS plugin has loaded; wait for both so a slow start fails here,
        # named, instead of as a test failure.
        run: |
          PYTHONPATH=src .venv/bin/python - <<'PY'
          import os, time
          import neo4j
          auth = ("neo4j", os.environ["L9_MEMORY_TEST_NEO4J_PASSWORD"])
          deadline = time.monotonic() + 180
          while True:
              try:
                  with neo4j.GraphDatabase.driver("bolt://localhost:7687", auth=auth) as d:
                      version = d.execute_query("RETURN gds.version() AS v").records[0]["v"]
                  print(f"GDS {version} ready")
                  break
              except Exception as exc:
                  if time.monotonic() > deadline:
                      raise SystemExit(f"Neo4j/GDS not ready: {type(exc).__name__}")
                  time.sleep(3)
          PY
      - name: Every live graph test file is covered by this job
        # A new file bound to the live Neo4j settings must be added below, or it
        # would skip in `validate` and never run here. A set comparison.
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            tests/integration/test_neo4j_gds_analytics.py \
            tests/integration/test_neo4j_graph_intelligence_live.py \
            tests/integration/test_neo4j_graph_traversal.py \
            tests/integration/test_neo4j_restart_outage_live.py | sort)"
          actual="$(grep -rlE 'live_neo4j_settings|L9_MEMORY_TEST_NEO4J_URI' tests/integration \
            | grep -v neo4j_graph_fixture.py | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "Live graph test files changed; update this job's test list." >&2
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Run live graph-intelligence suites (outage and restart included)
        env:
          # The outage test stops and starts this job's own Neo4j container.
          L9_MEMORY_TEST_NEO4J_STOP_CMD: docker stop ${{ job.services.neo4j.id }}
          L9_MEMORY_TEST_NEO4J_START_CMD: docker start ${{ job.services.neo4j.id }}
        run: |
          PYTHONPATH=src .venv/bin/python -m pytest -rs -p no:cacheprovider \
            --junitxml=graph-live.xml \
            tests/integration/test_neo4j_gds_analytics.py \
            tests/integration/test_neo4j_graph_intelligence_live.py \
            tests/integration/test_neo4j_graph_traversal.py \
            tests/integration/test_neo4j_restart_outage_live.py
      - name: Fail if any live test skipped
        # The failure this job exists to catch is a silent skip.
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse("graph-live.xml").getroot().iter("testsuite")
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          if skipped:
              raise SystemExit(f"{skipped} live graph test(s) skipped")
          print("no live graph test skipped")
          PY
