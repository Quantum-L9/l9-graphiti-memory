name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,server]'
      - run: ruff check .
      - run: mypy src/l9_graphite_memory
      - name: Test active-memory subsystem
        run: PYTHONPATH=src pytest tests/unit/active tests/conformance/active tests/external_runtime -v
      - name: Gate active-memory public API
        run: PYTHONPATH=src python tools/assurance/check_active_memory_public_api.py
      - run: bash scripts/validate_release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-py${{ matrix.python-version }}
          path: validation/
