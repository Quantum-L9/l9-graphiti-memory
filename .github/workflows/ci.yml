# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/l9-graphiti-memory
#   path: .github/workflows/ci.yml
#   layer: ci
#   owner: memory-control-plane
#   status: active
#   version: 2.3.0
#   updated: 2026-08-27

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    # The shared canonical store is the production backend (ADR-072), so CI
    # runs the store, ledger, outbox-lease, and maintenance matrices against a
    # real PostgreSQL instance. Without it those cases skip and the suite would
    # report green while never exercising the backend deployments actually use.
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway per-job container reachable only from this job, so it
          # carries no password to commit. Production deployments use a real
          # credential resolved from the runtime secret path (ADR-072).
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: l9memtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      L9_MEMORY_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres dbname=l9memtest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync locked environment
        run: uv sync --frozen --no-install-project --no-build --extra dev --extra server --extra postgres
      - name: Put uv venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Expose src on PYTHONPATH
        run: echo "PYTHONPATH=$PWD/src${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: mypy src/l9_graphite_memory
      - name: Test active-memory subsystem
        run: PYTHONPATH=src pytest tests/unit/active tests/conformance/active tests/external_runtime -v
      - name: Gate active-memory public API
        run: PYTHONPATH=src python tools/assurance/check_active_memory_public_api.py
      - run: bash scripts/validate_release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-py${{ matrix.python-version }}
          path: validation/

  # RP-001/RP-002 bind this package to the authoritative TransportPacket and
  # Gate client, but the `validate` matrix omits the `constellation` extra, so
  # every pytest.importorskip("constellation_node_sdk") case skipped on both
  # legs. An unavailable tag or an incompatible SDK API could still produce a
  # green release validation while the binding was marked bound: asserted,
  # never exercised (issue #39).
  #
  # A separate job rather than a fourth extra on `validate`, for two reasons.
  # An SDK outage fails a check that names the SDK instead of turning the whole
  # release-validation matrix red; and `validate` keeps skipping these cases, so
  # the V-001 execution count in tools/assurance/generate_validation_evidence.py
  # stays put instead of moving every time this job changes.
  constellation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The extra is gated `python_full_version >= '3.12'`, so the matrix's
          # 3.10 leg could never carry it. This job pins the supported leg.
          python-version: '3.13'
      - name: Sync the constellation extra
        # No --no-build here, unlike `validate`: the SDK is a git source
        # distribution with no wheel, and --no-build refuses it outright with
        # "can't be installed because it is marked as `--no-build` but has no
        # binary distribution". uv.lock pins the exact commit behind the tag,
        # so building it is not fetching arbitrary code.
        run: uv sync --frozen --no-install-project --extra dev --extra constellation
      - name: Prove the SDK is importable
        # The failure this job exists to catch is a SILENT skip. Import it
        # explicitly first so a missing or broken SDK fails a step that names
        # it, instead of quietly turning the contract tests into no-ops.
        run: PYTHONPATH=src .venv/bin/python -c "import constellation_node_sdk"
      - name: Every SDK-bound test file is covered by this job
        # Guards the same failure one level up: a new file that binds the SDK
        # must be added below, or it would skip in `validate` and never run
        # here. A set comparison, deliberately not a pinned count.
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            tests/unit/test_canonical_gate_client.py \
            tests/unit/test_canonical_transport_packet.py | sort)"
          actual="$(grep -rl 'importorskip("constellation_node_sdk")' tests/ | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "SDK-bound test files changed; update this job's test list." >&2
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Run the constellation contract tests
        run: |
          PYTHONPATH=src .venv/bin/python -m pytest \
            tests/unit/test_canonical_transport_packet.py \
            tests/unit/test_canonical_gate_client.py -q
