# --- L9_META ---
# l9_schema: 1
# repo: Quantum-L9/l9-graphiti-memory
# path: .l9/deployment.yaml
# layer: deployment
# owner: memory-control-plane
# status: candidate
# version: 3.0.0
# updated: 2026-11-13
# --- /L9_META ---
#
# The hosted Memory 3.0 service's deployment contract (l9.deployment-profile/v2,
# Quantum-L9/l9-deploy ADR-0008): the candidate names its own target. Memory stays
# ProductKind=dependency under l9.product-kind-exception/memory-hosted-service@1;
# this is not a Constellation node.
#
# A committed profile is a candidate. It deploys nothing by itself: only a release
# request for an admitted, tagged source (.github/workflows/release-container.yml)
# reaches l9-deploy, and l9-deploy still requires its protected-environment approval.
schema: l9.deployment-profile/v2
project:
  id: l9-graphiti-memory
  repository: Quantum-L9/l9-graphiti-memory
  owner_team: memory-control-plane
  # Canonical memory is durable state held outside the container.
  runtime_profile: stateful-container
artifact:
  registry: ghcr.io
  image: ghcr.io/quantum-l9/l9-graphiti-memory
runtime:
  architecture: linux/amd64
  container_port: 8200
  user: non_root
  # The server writes nothing locally on the postgres backend; a read-only root
  # also leaves no writable place for a SQLite ledger to appear.
  read_only_root_filesystem: true
  stop_grace_seconds: 30
  # Non-secret settings only. Compose gives these precedence over the rendered
  # runtime.env, so a secret store entry cannot switch the backend.
  # No L9_MEMORY_HTTP_AUTH_MODE: ADR-100 admits only Auth0 OAuth as the hosted
  # door and this release has no OAuth mode, so the carrier refuses every mode
  # (signed-agent and bearer included, from here or from runtime.env) and does
  # not start. Issue #108 pins the OAuth mode here.
  environment:
    L9_MEMORY_STORE_BACKEND: postgres
    L9_MEMORY_HTTP_AUTH_REQUIRED: "true"
    # Every other backend is pinned off here, where a stale runtime.env entry
    # cannot reach it: the only external system this release talks to is
    # its PostgreSQL store.
    L9_MEMORY_PROJECTION_BACKEND: none
    L9_MEMORY_PROJECTION_RUNTIME: legacy
    L9_MEMORY_GRAPH_BACKEND: none
    L9_MEMORY_ACTIVE_BACKEND: none
    L9_MEMORY_JSON_LOGS: "1"
health:
  # Through the existing HTTPS endpoint. /readyz answers 200 only while the
  # canonical PostgreSQL store is healthy.
  startup:
    type: http
    path: /readyz
    expected_status: 200
    timeout_seconds: 10
    interval_seconds: 5
    attempts: 24
  post_deploy:
    type: http
    path: /readyz
    expected_status: 200
    timeout_seconds: 10
    interval_seconds: 5
    attempts: 12
release:
  strategy: replace
  automatic_rollback: true
  stabilization_seconds: 30
migrations:
  # The store creates its own schema on startup; there is no separate migration.
  enabled: false
  backup_required: false
storage:
  # The release itself holds no durable state. The database's data lives in a
  # named Docker volume the operator provisions once with the database
  # container (RUNBOOK.md, "Hosted Memory on C1"); l9-deploy neither creates nor
  # mounts it, so it is not declared here. Consequence: no volume carries
  # backup_policy before_deploy and migrations are off, so a deployment plan has
  # no pre-deploy backup step. Backups run from l9-deploy's backup-verify
  # workflow, on the operator's schedule.
  persistent_volumes: []
services:
  # The one canonical store: a dedicated PostgreSQL 16 container on C1, attached
  # to the external Docker network l9-runtime with a named volume and no
  # published host port. The operator provisions it once from the runbook;
  # mode external means l9-deploy never does. It is not C1's loopback database
  # (127.0.0.1:5432), which a container cannot reach.
  #
  # Its DSN arrives only in the rendered runtime.env (L9_MEMORY_POSTGRES_DSN)
  # and names the database by container name, which resolves only on
  # l9-runtime. So the probe runs inside the release container (Compose names
  # it <project>-app-1), which is on that network, and prints nothing; a client
  # on the host could not resolve the name.
  postgres:
    mode: external
    required: true
    probe:
      type: database
      command:
        - docker
        - exec
        - l9-graphiti-memory-app-1
        - python
        - -c
        - "import os, psycopg2; psycopg2.connect(os.environ['L9_MEMORY_POSTGRES_DSN'], connect_timeout=5).close()"
      timeout_seconds: 15
      interval_seconds: 5
      attempts: 6
backup:
  # Each command is an argument vector l9-deploy runs on C1 over SSH, after
  # str.format_map with project, environment and request_id: a literal brace in
  # an argument would have to be doubled, so these scripts use none.
  #
  # The dump does not use /usr/local/sbin/l9-postgres-backup: that runs the
  # host's pg_dump (distribution package, version unpinned, possibly older than
  # the server) against a DSN whose host name does not resolve on the host.
  # Instead:
  # - the release container, which holds the DSN, splits it into libpq PG*
  #   variables. They are captured by the shell, never printed, and a DSN that
  #   does not parse is reported without its text;
  # - a pinned PostgreSQL 16 image (the digest the restore test uses) runs
  #   pg_dump on l9-runtime. docker run -e NAME forwards each variable by name,
  #   so no credential is on a command line that ps shows, here or in the
  #   container. Only host, port, user, password, dbname and sslmode are carried;
  # - the dump lands where l9-postgres-backup would put it, with the .sha256
  #   beside it, so /usr/local/sbin/l9-backup-verify verifies it unchanged.
  command:
    - sh
    - -c
    - |-
      set -eu
      umask 077
      unset PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE PGSSLMODE
      eval "$(docker exec l9-graphiti-memory-app-1 python -c '
      import os, shlex, sys
      from psycopg2.extensions import parse_dsn
      try:
          dsn = parse_dsn(os.environ["L9_MEMORY_POSTGRES_DSN"])
      except Exception:
          sys.exit("L9_MEMORY_POSTGRES_DSN is missing or does not parse")
      pairs = (("PGHOST", "host"), ("PGPORT", "port"), ("PGUSER", "user"),
               ("PGPASSWORD", "password"), ("PGDATABASE", "dbname"), ("PGSSLMODE", "sslmode"))
      for name, key in pairs:
          if dsn.get(key):
              print("export %s=%s" % (name, shlex.quote(str(dsn[key]))))
      ')"
      test -n "$PGHOST"
      test -n "$PGDATABASE"
      dir=/srv/l9/backups/{project}/{environment}
      out="$dir/{request_id}.sql.gz"
      mkdir -p "$dir"
      trap 'rm -f "$out.tmp"' EXIT
      docker run --rm --network l9-runtime \
        -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \
        postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97 \
        bash -o pipefail -c 'pg_dump --format=plain --no-owner --no-privileges | gzip' > "$out.tmp"
      test -s "$out.tmp"
      gzip -dc "$out.tmp" | tail -n 5 | grep -q 'PostgreSQL database dump complete'
      mv "$out.tmp" "$out"
      sha256sum "$out" > "$out.sha256"
      printf '%s\n' "$out"
  verify_command:
    - sh
    - -c
    - >-
      f="$(ls -1t /srv/l9/backups/{project}/{environment}/*.sql.gz | head -n 1)"
      && test -n "$f"
      && exec /usr/local/sbin/l9-backup-verify "$f"
  # Isolated restore: the newest verified dump is loaded into a throwaway,
  # network-less PostgreSQL 16 container, never into the live database, and must
  # yield the canonical memory_records table.
  restore_test_command:
    - sh
    - -c
    - >-
      set -eu;
      f="$(ls -1t /srv/l9/backups/{project}/{environment}/*.sql.gz | head -n 1)";
      /usr/local/sbin/l9-backup-verify "$f";
      c="l9-restore-{project}-{environment}";
      docker rm -f "$c" >/dev/null 2>&1 || true;
      docker run -d --rm --name "$c" --network none -e POSTGRES_HOST_AUTH_METHOD=trust
      postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97 >/dev/null;
      trap 'docker rm -f "$c" >/dev/null 2>&1' EXIT;
      i=0; until docker exec "$c" pg_isready -U postgres -q; do i=$((i+1)); test "$i" -lt 60; sleep 1; done;
      gzip -dc "$f" | docker exec -i "$c" psql -v ON_ERROR_STOP=1 -q -U postgres -d postgres >/dev/null;
      docker exec "$c" psql -U postgres -d postgres -tAc
      "select count(*) from information_schema.tables where table_name = 'memory_records'" | grep -qx '[1-9][0-9]*'
  timeout_seconds: 1800
secrets:
  authority: infisical
  runtime_mode: deploy_render
  project_slug: l9-graphiti-memory
targets:
  # C1 (Hetzner server 114194366) is a shared, protected host
  # (Cursor-Governance rules/93-c1-server-protection). Not the separate L9-Memory
  # VM 119722208.
  # - docker: verify checks the existing Docker runtime without changing it.
  # - ingress: external publishes only 127.0.0.1:8200 for the host's existing
  #   Caddy, and l9-deploy never installs or edits a Caddy site in this mode. The
  #   /graphiti route (127.0.0.1:8100) and Cognitive Runtime (18080) are not touched.
  # - Port 8200 is held by the legacy 2.2.0 systemd service until the separately
  #   authorized cutover; this release must not be deployed while it still binds it.
  production:
    server:
      address: 46.62.243.82
      ssh:
        user: root
        port: 22
      # Evidence lead only: the key Quantum-L9/l9-cognitive-runtime@94348537
      # .l9/deployment.yaml pins for this same address. It must be re-verified
      # against the host over a trusted channel before any release is requested.
      host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICMwpLXB2J962/OrrUqXNGwiHb39e7f9jSKixo97xJxU
    host:
      # verify: l9-deploy checks the existing Docker runtime and refuses the host
      # if it does not meet its floor (docker compose 2.30.0 or newer); it never
      # installs or upgrades Docker here.
      docker: verify
      # Stays postgres for /usr/local/sbin/l9-backup-verify, which the verify and
      # restore-test commands call. The same setting also installs
      # l9-postgres-backup and the distribution's postgresql-client; this
      # profile calls neither (see backup above).
      backup_tools: postgres
    ingress:
      mode: external
      hostnames:
        - memory.quantumaipartners.com
      host_port: 8200
    # Only the admitted release tag. A version bump moves this with
    # PACKAGE_VERSION (tests/deployment/carrier/test_deployment_profile.py).
    allowed_source_refs:
      - refs/tags/v3.0.0
    secrets_environment: prod
