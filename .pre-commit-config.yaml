# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/l9-graphiti-memory
#   path: .pre-commit-config.yaml
#   layer: repository
#   owner: memory-control-plane
#   status: active
#   version: 2.2.0
#   updated: 2026-07-22

# Mechanical enforcement before commit. Enable once per clone with:
#   pre-commit install
# Run manually with: pre-commit run --all-files
#
# Order matters: ruff fixes and formats first, then the L9 hooks inject inline
# metadata headers and rebuild manifest.json / MANIFEST.md over the final tree.
# The L9 hooks mutate files, so if anything changes the commit aborts for you to
# review, git add, and commit again. CI stays the authoritative backstop: the
# same L9 scripts run in --check mode in the CI validate job, and the
# metadata/alignment gates fail the build if any tracked file is unregistered.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: l9-apply-meta
        name: inject L9 metadata headers
        entry: python3 tools/assurance/apply_l9_meta.py
        language: system
        pass_filenames: false
        always_run: true
      - id: l9-generate-manifest
        name: rebuild release manifest
        entry: python3 tools/assurance/generate_manifest.py
        language: system
        pass_filenames: false
        always_run: true
